<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Registration Form</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: #1a252f;
        }

        .btn-autofill {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-autofill:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Book Registration</h2>
        
        <form id="bookForm">
            <div class="form-group">
                <label for="bookTitle">Book Title</label>
                <input type="text" id="bookTitle" required placeholder="Enter book title">
            </div>

            <div class="form-group">
                <label for="bookAuthor">Author</label>
                <input type="text" id="bookAuthor" required placeholder="Enter author's name">
            </div>

            <div class="form-group">
                <label for="bookIsbn">ISBN</label>
                <input type="text" id="bookIsbn" required placeholder="e.g., 978-3-16-148410-0">
            </div>

            <div class="form-group">
                <label for="bookYear">Publication Year</label>
                <input type="number" id="bookYear" required min="1000" max="2026" placeholder="e.g., 2026">
            </div>

            <div class="button-group">
                <button type="button" class="btn-autofill" id="autoFillBtn">Auto-Fill Sample</button>
                <button type="submit" class="btn-submit">Register Book</button>
            </div>
        </form>
    </div>

    <script>
        const bookForm = document.getElementById('bookForm');
        const autoFillBtn = document.getElementById('autoFillBtn');
        
        const titleInput = document.getElementById('bookTitle');
        const authorInput = document.getElementById('bookAuthor');
        const isbnInput = document.getElementById('bookIsbn');
        const yearInput = document.getElementById('bookYear');

        // Sample data for the Auto-Fill function
        const sampleBook = {
            title: "The Pragmatic Programmer",
            author: "Andrew Hunt & David Thomas",
            isbn: "978-0135957059",
            year: 2019
        };

        // Click handler that inserts data into your form fields
        autoFillBtn.addEventListener('click', () => {
            titleInput.value = sampleBook.title;
            authorInput.value = sampleBook.author;
            isbnInput.value = sampleBook.isbn;
            yearInput.value = sampleBook.year;
        });

        bookForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert(`Success! "${titleInput.value}" has been registered.`);
            bookForm.reset();
        });
    </script>

</body>
</html>
